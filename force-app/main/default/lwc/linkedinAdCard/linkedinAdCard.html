<template>
    <div class="ad-card">
        <!-- Ad header -->
        <div class="ad-header">
            <span class="ad-label">Ad</span>
            <button class="ad-more-btn" title="More options" onclick={handleMore}>
                <img src={moreHorizontalUrl} alt="More" class="ad-more-icon" />
            </button>
        </div>

        <!-- Body text -->
        <p class="ad-body-text">{bodyText}</p>

        <!-- Avatars -->
        <div class="ad-avatars">
            <c-linkedin-user-avatar name={userName} photo={userPhoto} size='64'></c-linkedin-user-avatar>
            <div class="ad-avatar-circle--premium">
                <img class="ad-avatar-img--premium" src={premiumLogoUrl} alt="LinkedIn Premium" />
            </div>
        </div>

        <!-- CTA text -->
        <p class="ad-cta-text">{ctaTitle}</p>

        <!-- Button -->
        <button class="ad-cta-btn" onclick={handleCta}>
            {ctaLabel}
        </button>
    </div>
</template>
