<template>
    <div class="composer-card">
        <!-- Top row: avatar + input trigger -->
        <div class="composer-top">
            <c-linkedin-user-avatar name={userName} photo={userPhoto}></c-linkedin-user-avatar>
            <button class="composer-input-trigger" onclick={handleStartPost}>
                <span>{placeholder}</span>
            </button>
        </div>

        <!-- Bottom row: media actions -->
        <div class="composer-actions">
            <button class="composer-action-btn" onclick={handleVideo}>
                <img src={videoIconUrl} alt="Video" />
                <span>Video</span>
            </button>
            <button class="composer-action-btn" onclick={handlePhoto}>
                <img src={photoIconUrl} alt="Photo" />
                <span>Photo</span>
            </button>
            <button class="composer-action-btn" onclick={handleArticle}>
                <img src={articleIconUrl} alt="Article" />
                <span>Write article</span>
            </button>
        </div>
    </div>
</template>
