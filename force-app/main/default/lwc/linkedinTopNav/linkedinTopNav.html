<template>
    <nav class="top-nav">
        <div class="nav-content">
            <!-- Left: logo + search -->
            <div class="nav-left">
                <div class="nav-logo">
                    <img src={liLogoUrl} alt="LinkedIn" class="nav-logo-img" />
                </div>
                <div class="nav-search">
                    <img src={searchIconUrl} alt="Search" />
                    <input type="search" class="nav-search-input" placeholder={searchPlaceholder} />
                </div>
            </div>

            <!-- Center: navigation items -->
            <div class="nav-center">
                <button class="nav-item nav-item--active" onclick={handleHome}>
                    <!-- <img src={homeIconUrl} alt="Home" class="nav-icon" /> -->
                    <c-linkedin-icon name="home"></c-linkedin-icon>
                    <span>Home</span>
                </button>
                <button class="nav-item" onclick={handleNetwork}>
                    <c-linkedin-icon name="network"></c-linkedin-icon>
                    <span>My Network</span>
                </button>
                <button class="nav-item" onclick={handleJobs}>
                    <c-linkedin-icon name="briefcase"></c-linkedin-icon>
                    <span>Jobs</span>
                </button>
                <button class="nav-item" onclick={handleMessaging}>
                    <c-linkedin-icon name="messaging"></c-linkedin-icon>
                    <span>Messaging</span>
                </button>
                <button class="nav-item" onclick={handleNotifications}>
                    <c-linkedin-icon name="bell"></c-linkedin-icon>
                    <span>Notifications</span>
                </button>


                <!-- Me -->
                <button class="nav-item nav-item--me" onclick={handleMe}>
                    <c-linkedin-user-avatar name={userName} photo={userPhoto} size='24'></c-linkedin-user-avatar>
                    <span class="nav-label">
                        Me
                        <c-linkedin-icon name="caret"></c-linkedin-icon>
                    </span>
                </button>

                <div class="nav-divider"></div>

                <!-- For Business -->
                <button class="nav-item nav-item--business" onclick={handleBusiness}>
                    <c-linkedin-icon name="grid"></c-linkedin-icon>
                    <span class="nav-label">
                        For Business
                        <c-linkedin-icon name="caret"></c-linkedin-icon>
                    </span>
                </button>

                <!-- Try Premium -->
                <button class="nav-item nav-item--premium" onclick={handlePremium}>
                    <img src={premiumIconUrl} alt="Premium" class="nav-icon" />
                    <span>Try Premium for $0</span>
                </button>
            </div>
        </div>
    </nav>
</template>
