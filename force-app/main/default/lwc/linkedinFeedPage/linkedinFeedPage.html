<template>
    <!-- Top navigation -->
    <c-linkedin-top-nav
        user-name={resolvedUser.name}
        user-photo={resolvedUser.avatarPhoto}
        nav-config={navConfig}
    ></c-linkedin-top-nav>

    <!-- Page body -->
    <div class="feed-page">
        <!-- Left sidebar -->
        <aside class="feed-sidebar">
            <c-linkedin-profile-card
                name={resolvedUser.name}
                job-title={resolvedUser.jobTitle}
                location={resolvedUser.location}
                avatar-photo={resolvedUser.avatarPhoto}
                cover-photo={resolvedUser.coverPhoto}
                profile-viewers={resolvedUser.profileViewers}
                show-stats={resolvedShowStats}
                show-links={resolvedShowLinks}
            ></c-linkedin-profile-card>
        </aside>

        <!-- Main feed -->
        <main class="feed-main">
            <!-- Post composer -->
            <c-linkedin-post-composer
                user-photo={resolvedUser.avatarPhoto}
                user-name={resolvedUser.name}
                placeholder={composerPlaceholder}
                onstartpost={handleStartPost}
                onaddvideo={handleAddVideo}
                onaddphoto={handleAddPhoto}
                onwritearticle={handleWriteArticle}
            ></c-linkedin-post-composer>

            <!-- Sort bar -->
            <div class="feed-sort-bar">
                <div class="feed-sort-divider"></div>
                <div class="feed-sort-controls">
                    <button class="feed-sort-btn" onclick={handleSort}>
                        <span >Sort by: </span>
                        <strong class="feed-sort-label">{sortLabel}</strong>
                        <img src={chevronDownUrl} alt="" class="feed-sort-icon" />
                    </button>
                </div>
            </div>

            <!-- Posts -->
            <template for:each={resolvedPosts} for:item="post">
                <div key={post.id} class="feed-post-wrapper">
                    <c-social-post
                    variant={post.variant}
                    context-type={post.contextType}
                    context-text={post.contextText}
                    show-follow={post.showFollow}
                    show-dismiss={post.showDismiss}
                    author-name={post.authorName}
                    author-title={post.authorTitle}
                    author-photo={post.authorPhoto}
                    author-verified={post.authorVerified}
                    author-badge={post.authorBadge}
                    time-ago={post.timeAgo}
                    content={post.content}
                    reactions={post.reactions}
                    comments-count={post.commentsCount}
                    reposts-count={post.repostsCount}
                    visibility={post.visibility}
                    reaction-types={post.reactionTypes}
                    initial-reaction={post.initialReaction}
                    media-image-url={post.mediaImageUrl}
                    media-title={post.mediaTitle}
                    media-domain={post.mediaDomain}
                    media-cta-label={post.mediaCtaLabel}
                    media-cta-url={post.mediaCtaUrl}
                    media-footer-bg={post.mediaFooterBg}
                    media-mode={post.mediaType}
                    content-hashtags={post.contentHashtags}
                    media-gradient-url={post.mediaGradientUrl}
                    media-overlay-title={post.mediaOverlayTitle}
                    media-overlay-title-dark={post.mediaOverlayTitleDark}
                    media-overlay-logo-url={post.mediaOverlayLogoUrl}
                    comment-author-name={post.commentAuthorName}
                    comment-author-title={post.commentAuthorTitle}
                    comment-author-photo={post.commentAuthorPhoto}
                    comment-text={post.commentText}
                    comment-time-ago={post.commentTimeAgo}>
                </c-social-post>
                </div>
            </template>
        </main>

        <!-- Right sidebar -->
        <aside class="feed-sidebar">
            <!-- News -->
            <c-linkedin-news-section
                title={newsSectionTitle}
                news-items={resolvedNewsItems}
                show-more-label={newsShowMoreLabel}
                onnewsclick={handleNewsClick}
                onshowmore={handleShowMoreNews}
            ></c-linkedin-news-section>

            <!-- Ad / Premium -->
            <c-linkedin-ad-card
                user-photo={resolvedUser.avatarPhoto}
                user-name={resolvedUser.name}
            ></c-linkedin-ad-card>

            <!-- Sticky footer links -->
            <div class="feed-footer">
                <div class="feed-footer-links">
                    <span class="feed-footer-link">About</span>
                    <span class="feed-footer-link">Accessibility</span>
                    <span class="feed-footer-link">Help Center</span>
                    <span class="feed-footer-link">Privacy &amp; Terms  <c-linkedin-icon name="caret"></c-linkedin-icon></span>
                    <span class="feed-footer-link">Ad Choices</span>
                    <span class="feed-footer-link">Advertising</span>
                    <span class="feed-footer-link">Business Services  <c-linkedin-icon name="caret"></c-linkedin-icon></span>
                    <span class="feed-footer-link">Get the LinkedIn app </span>
                    <span class="feed-footer-link">More</span>
                </div>
                <div class="feed-footer-brand">
                    <img src={linkedinLogoUrl} alt="LinkedIn" class="feed-footer-logo" />
                    <span class="feed-footer-copy">LinkedIn Corporation © 2026</span>
                </div>
            </div>
        </aside>
    </div>
</template>
